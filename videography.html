    <script>
      const videos = document.getElementsByClassName("videoControl");

      for (let i = 0; i < videos.length; i++) {
        videos[i].addEventListener("mouseenter", () => {
          videos[i].setAttribute("controls", "");
        });

        videos[i].addEventListener("mouseleave", () => {
          videos[i].removeAttribute("controls");
        });
      }
    </script>
